<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pejuang Nangor My friend!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2ea;
    --purple-deep:#4a3459;
    --purple-mid:#8a6ea8;
    --gold:#a07855;
    --gold-soft:#c39b6b;
    --paper:#f3ece0;
    --paper-shade:#e7dcce;
    --paper-dark:#eae0d0;
    --paper-border:#e2d5c3;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
    padding:24px;
  }

  /* ambient background */
  .bg-blob{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    z-index:0;
    opacity:.55;
  }
  .blob-1{width:340px;height:340px;background:#e8d8c3;bottom:-60px;left:-70px;}
  .blob-2{width:380px;height:380px;background:#ebdcc9;top:-80px;right:-80px;}
  .grain{
    position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(74,52,89,.035) 1px, transparent 1px);
    background-size:3px 3px;
  }

  .main-container{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
    max-width:640px;
  }

  /* ---------- ENVELOPE ---------- */
  .envelope-box{
    position:relative;
    width:300px;
    height:200px;
    cursor:pointer;
    margin-bottom:36px;
  }

  .envelope-glow{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:360px;height:280px;
    background:radial-gradient(circle, rgba(255,222,150,.65) 0%, rgba(255,255,255,0) 70%);
    border-radius:50%;
    z-index:0;
    opacity:0;
    transition:opacity 1s ease;
    pointer-events:none;
  }

  .envelope-back{
    position:absolute;
    width:100%;height:100%;
    background:linear-gradient(160deg,#f6f0e4,var(--paper));
    border:1px solid var(--paper-border);
    border-radius:6px;
    z-index:1;
    box-shadow:0 18px 34px rgba(74,52,89,.12), 0 4px 10px rgba(74,52,89,.06);
  }

  .bouquet-wrap{
    position:absolute;
    left:50%;
    bottom:36px;
    width:280px;
    z-index:2;
    transform:translateX(-50%) translateY(46px) scale(.55);
    opacity:0;
    transform-origin:bottom center;
    transition:transform 1s cubic-bezier(.175,.885,.32,1.16), opacity .5s ease;
    pointer-events:none;
    filter:drop-shadow(0 10px 14px rgba(74,52,89,.12));
  }

  .envelope-front-pocket{
    position:absolute;
    bottom:0;left:0;
    width:0;height:0;
    border-left:150px solid var(--paper);
    border-right:150px solid var(--paper);
    border-bottom:104px solid var(--paper-shade);
    border-radius:0 0 6px 6px;
    z-index:3;
    filter:drop-shadow(0 -2px 5px rgba(0,0,0,.04));
  }

  .envelope-top-flap{
    position:absolute;
    top:0;left:0;
    width:0;height:0;
    border-left:150px solid transparent;
    border-right:150px solid transparent;
    border-top:104px solid var(--paper-dark);
    transform-origin:top;
    transition:transform .7s cubic-bezier(.65,0,.35,1);
    z-index:4;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.04));
  }

  .wax-seal{
    position:absolute;
    top:82px;left:50%;
    transform:translateX(-50%);
    width:38px;height:38px;
    border-radius:50%;
    z-index:5;
    background:radial-gradient(circle at 32% 30%, #d8ac78, var(--gold-soft) 55%, var(--gold) 100%);
    box-shadow:0 3px 7px rgba(0,0,0,.18), inset 0 -2px 3px rgba(0,0,0,.15);
    display:flex;align-items:center;justify-content:center;
    color:#fff6e8;
    font-size:16px;
    transition:opacity .35s ease, transform .35s ease;
  }

  .envelope-box.open .envelope-top-flap{ transform:rotateX(180deg); z-index:1; }
  .envelope-box.open .wax-seal{ opacity:0; transform:translateX(-50%) scale(.4); }
  .envelope-box.open .bouquet-wrap{
    opacity:1;
    transform:translateX(-50%) translateY(-118px) scale(1.02);
  }
  .envelope-box.open .envelope-glow{ opacity:1; }
  .envelope-box:not(.open):hover .envelope-back{ box-shadow:0 22px 38px rgba(74,52,89,.16); }
  .envelope-box:not(.open):hover .envelope-top-flap{ transform:rotateX(-6deg); }

  /* falling petals */
  .petal{
    position:absolute;
    z-index:6;
    opacity:0;
    pointer-events:none;
  }
  .envelope-box.open .petal{ animation:fall 2.6s ease-in forwards; }
  .petal:nth-child(1){ left:18%; top:-10px; animation-delay:.5s; }
  .petal:nth-child(2){ left:78%; top:-14px; animation-delay:.8s; }
  .petal:nth-child(3){ left:48%; top:-6px; animation-delay:1.05s; }
  @keyframes fall{
    0%{ opacity:0; transform:translateY(0) rotate(0deg); }
    12%{ opacity:.9; }
    100%{ opacity:0; transform:translateY(160px) rotate(200deg); }
  }

  /* ---------- TEXT ---------- */
  .text-group{ text-align:center; }
  .eyebrow{
    font-size:.72rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:10px;
    opacity:.85;
  }
  .main-title{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:2.3rem;
    color:var(--purple-deep);
    font-weight:600;
    margin-bottom:8px;
    line-height:1.15;
  }
  .sub-title{
    font-size:.95rem;
    color:var(--gold);
    font-weight:400;
    transition:opacity .4s ease;
  }

  .next-btn{
    margin-top:26px;
    padding:11px 30px;
    background:var(--purple-deep);
    color:#fbf3e7;
    border:none;
    border-radius:22px;
    font-family:'Poppins',sans-serif;
    font-size:.88rem;
    letter-spacing:.02em;
    cursor:pointer;
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
    transition:opacity .5s ease .5s, transform .5s ease .5s, background .25s ease;
  }
  .next-btn:hover{ background:#5e4270; }
  .envelope-box.open ~ .text-group .next-btn{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }

  @media (prefers-reduced-motion: reduce){
    .envelope-top-flap, .bouquet-wrap, .wax-seal, .envelope-glow, .next-btn{ transition:none !important; }
    .petal{ animation:none !important; }
  }

  @media (max-width:380px){
    .envelope-box{ width:250px; height:168px; }
    .envelope-front-pocket{ border-left-width:125px; border-right-width:125px; border-bottom-width:88px; }
    .envelope-top-flap{ border-left-width:125px; border-right-width:125px; border-top-width:88px; }
    .bouquet-wrap{ width:230px; bottom:30px; }
    .main-title{ font-size:1.8rem; }
  }
</style>
</head>
<body>

<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>
<div class="grain"></div>

<div class="main-container">

  <div class="envelope-box" id="envelope" role="button" tabindex="0" aria-label="Buka amplop">
    <div class="envelope-glow"></div>
    <div class="envelope-back"></div>
    <div class="envelope-top-flap"></div>

    <div class="bouquet-wrap">
      <!-- Bouquet built with inline SVG -->
      <svg viewBox="0 0 280 260" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="sunPetal" cx="50%" cy="35%" r="75%">
            <stop offset="0%" stop-color="#ffe27a"/>
            <stop offset="100%" stop-color="#f6b83c"/>
          </radialGradient>
          <radialGradient id="sunCenter" cx="45%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#6b4a2f"/>
            <stop offset="100%" stop-color="#3d2818"/>
          </radialGradient>
          <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8fae7c"/>
            <stop offset="100%" stop-color="#5c7a4d"/>
          </linearGradient>
          <radialGradient id="rosePetal" cx="50%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#c9a6e0"/>
            <stop offset="100%" stop-color="#9a6cbf"/>
          </radialGradient>
          <radialGradient id="ranunc" cx="50%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#f3d27a"/>
            <stop offset="100%" stop-color="#e3a93f"/>
          </radialGradient>
        </defs>

        <!-- stems -->
        <g stroke="#6f8f5e" stroke-width="3" fill="none" opacity=".9">
          <path d="M140 250 C 138 200, 132 160, 118 120"/>
          <path d="M140 250 C 142 200, 150 160, 168 118"/>
          <path d="M140 250 C 139 190, 140 150, 140 100"/>
          <path d="M140 250 C 130 210, 105 170, 78 130"/>
          <path d="M140 250 C 150 210, 178 170, 205 132"/>
        </g>

        <!-- eucalyptus leaves left -->
        <g>
          <ellipse cx="72" cy="150" rx="13" ry="8" fill="url(#leafGrad)" transform="rotate(-35 72 150)"/>
          <ellipse cx="60" cy="170" rx="12" ry="7" fill="url(#leafGrad)" transform="rotate(-15 60 170)"/>
          <ellipse cx="85" cy="130" rx="11" ry="7" fill="url(#leafGrad)" transform="rotate(-50 85 130)"/>
          <ellipse cx="95" cy="185" rx="12" ry="7" fill="#7a9a68" transform="rotate(10 95 185)"/>
        </g>
        <!-- eucalyptus leaves right -->
        <g>
          <ellipse cx="212" cy="150" rx="13" ry="8" fill="url(#leafGrad)" transform="rotate(35 212 150)"/>
          <ellipse cx="222" cy="172" rx="12" ry="7" fill="url(#leafGrad)" transform="rotate(15 222 172)"/>
          <ellipse cx="198" cy="128" rx="11" ry="7" fill="url(#leafGrad)" transform="rotate(50 198 128)"/>
          <ellipse cx="188" cy="188" rx="12" ry="7" fill="#7a9a68" transform="rotate(-10 188 188)"/>
        </g>
        <!-- fern sprigs -->
        <g stroke="#4f6f43" stroke-width="2" fill="none">
          <path d="M118 120 q-6 -4 -12 -2 M118 120 q-4 -8 -10 -8 M118 120 q-2 -10 -8 -12"/>
          <path d="M168 118 q6 -4 12 -2 M168 118 q4 -8 10 -8 M168 118 q2 -10 8 -12"/>
        </g>

        <!-- purple bellflowers (sprigs), back layer -->
        <g>
          <g transform="translate(78,128)">
            <ellipse cx="0" cy="0" rx="6" ry="9" fill="#a98fce" transform="rotate(-20)"/>
            <ellipse cx="8" cy="10" rx="5" ry="8" fill="#b9a1da" transform="rotate(10)"/>
            <ellipse cx="-6" cy="14" rx="5" ry="7" fill="#a98fce" transform="rotate(-40)"/>
          </g>
          <g transform="translate(205,130)">
            <ellipse cx="0" cy="0" rx="6" ry="9" fill="#a98fce" transform="rotate(20)"/>
            <ellipse cx="-8" cy="10" rx="5" ry="8" fill="#b9a1da" transform="rotate(-10)"/>
            <ellipse cx="6" cy="14" rx="5" ry="7" fill="#a98fce" transform="rotate(40)"/>
          </g>
        </g>

        <!-- yellow mimosa sprig top right -->
        <g transform="translate(198,95)">
          <circle cx="0" cy="0" r="4" fill="#f4c445"/>
          <circle cx="9" cy="6" r="4" fill="#f6cf5f"/>
          <circle cx="-6" cy="10" r="3.5" fill="#f4c445"/>
          <circle cx="4" cy="16" r="3.5" fill="#f6cf5f"/>
          <circle cx="14" cy="16" r="3" fill="#f4c445"/>
        </g>

        <!-- LEFT sunflower -->
        <g transform="translate(90,108)">
          <g fill="url(#sunPetal)">
            <ellipse cx="0" cy="-22" rx="7" ry="16"/>
            <ellipse cx="15" cy="-16" rx="7" ry="16" transform="rotate(40 15 -16)"/>
            <ellipse cx="21" cy="0" rx="7" ry="16" transform="rotate(80 21 0)"/>
            <ellipse cx="15" cy="16" rx="7" ry="16" transform="rotate(120 15 16)"/>
            <ellipse cx="0" cy="22" rx="7" ry="16" transform="rotate(160 0 22)"/>
            <ellipse cx="-15" cy="16" rx="7" ry="16" transform="rotate(200 -15 16)"/>
            <ellipse cx="-21" cy="0" rx="7" ry="16" transform="rotate(240 -21 0)"/>
            <ellipse cx="-15" cy="-16" rx="7" ry="16" transform="rotate(280 -15 -16)"/>
          </g>
          <circle cx="0" cy="0" r="13" fill="url(#sunCenter)"/>
        </g>

        <!-- RIGHT sunflower, slightly larger -->
        <g transform="translate(178,100)">
          <g fill="url(#sunPetal)">
            <ellipse cx="0" cy="-25" rx="8" ry="18"/>
            <ellipse cx="17" cy="-18" rx="8" ry="18" transform="rotate(40 17 -18)"/>
            <ellipse cx="24" cy="0" rx="8" ry="18" transform="rotate(80 24 0)"/>
            <ellipse cx="17" cy="18" rx="8" ry="18" transform="rotate(120 17 18)"/>
            <ellipse cx="0" cy="25" rx="8" ry="18" transform="rotate(160 0 25)"/>
            <ellipse cx="-17" cy="18" rx="8" ry="18" transform="rotate(200 -17 18)"/>
            <ellipse cx="-24" cy="0" rx="8" ry="18" transform="rotate(240 -24 0)"/>
            <ellipse cx="-17" cy="-18" rx="8" ry="18" transform="rotate(280 -17 -18)"/>
          </g>
          <circle cx="0" cy="0" r="14.5" fill="url(#sunCenter)"/>
        </g>

        <!-- purple ranunculus center-left -->
        <g transform="translate(118,80)">
          <circle r="16" fill="url(#rosePetal)"/>
          <circle r="12" fill="#b083cf"/>
          <circle r="8" fill="#9a6cbf"/>
          <circle r="4" fill="#7c4fa3"/>
        </g>

        <!-- lavender rose center (main focal, top) -->
        <g transform="translate(140,55)">
          <circle r="20" fill="url(#rosePetal)"/>
          <circle r="15" fill="#b58bd6"/>
          <circle r="10" fill="#9d6cc4"/>
          <circle r="5" fill="#84509f"/>
        </g>

        <!-- soft pink/yellow rose right -->
        <g transform="translate(168,72)">
          <circle r="15" fill="#f6cf6a"/>
          <circle r="11" fill="#f3ba3e"/>
          <circle r="6" fill="#e39f25"/>
        </g>

        <!-- small ranunculus far left -->
        <g transform="translate(72,105)">
          <circle r="11" fill="url(#ranunc)"/>
          <circle r="7" fill="#e6b34e"/>
          <circle r="3" fill="#c88a2c"/>
        </g>

        <!-- dark purple accent flower (statement, like reference) -->
        <g transform="translate(148,90)">
          <circle r="13" fill="#4a3459"/>
          <circle r="9.5" fill="#5c4270"/>
          <g fill="#3a2846">
            <ellipse cx="0" cy="-9" rx="2.4" ry="4"/>
            <ellipse cx="7" cy="-5" rx="2.4" ry="4" transform="rotate(60 7 -5)"/>
            <ellipse cx="7" cy="5" rx="2.4" ry="4" transform="rotate(120 7 5)"/>
            <ellipse cx="0" cy="9" rx="2.4" ry="4" transform="rotate(180 0 9)"/>
            <ellipse cx="-7" cy="5" rx="2.4" ry="4" transform="rotate(240 -7 5)"/>
            <ellipse cx="-7" cy="-5" rx="2.4" ry="4" transform="rotate(300 -7 -5)"/>
          </g>
          <circle r="3" fill="#2a1c33"/>
        </g>

        <!-- scattered small purple sprigs front -->
        <g>
          <g transform="translate(100,140)">
            <ellipse rx="4" ry="6" fill="#b9a1da" transform="rotate(-15)"/>
            <ellipse cx="6" cy="6" rx="3.5" ry="5" fill="#a98fce" transform="rotate(20 6 6)"/>
          </g>
          <g transform="translate(190,142)">
            <ellipse rx="4" ry="6" fill="#b9a1da" transform="rotate(15)"/>
            <ellipse cx="-6" cy="6" rx="3.5" ry="5" fill="#a98fce" transform="rotate(-20 -6 6)"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="wax-seal">✦</div>

    <span class="petal" style="width:8px;height:8px;background:#b9a1da;border-radius:50% 0;"></span>
    <span class="petal" style="width:7px;height:7px;background:#f4c445;border-radius:50% 0;"></span>
    <span class="petal" style="width:6px;height:6px;background:#c9a6e0;border-radius:50% 0;"></span>

    <div class="envelope-front-pocket"></div>
  </div>

  <div class="text-group">
    <p class="eyebrow">Untukmu</p>
    <h1 class="main-title">Happy Birthday, My Love!</h1>
    <p class="sub-title" id="subText">Klik amplopnya untuk memulai perayaan</p>
    <button class="next-btn" onclick="nextPage()">Lanjut ke Halaman 2 ✨</button>
  </div>

</div>

<script>
  const envelope = document.getElementById('envelope');
  const subText = document.getElementById('subText');

  function openEnvelope(){
    if (!envelope.classList.contains('open')) {
      envelope.classList.add('open');
      subText.textContent = 'Buket kecil ini untukmu 🌻';
    }
  }

  envelope.addEventListener('click', openEnvelope);
  envelope.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnvelope(); }
  });

  function nextPage(){
    alert("Siap lanjut ke Halaman 2!");
  }
</script>
</body>
</html>
