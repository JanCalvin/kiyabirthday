<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Birthday, My Love - Radio Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#140c1f;
    --purple-deep:#2d1b3e;
    --purple-mid:#62457c;
    --gold:#d4af37;
    --gold-soft:#f3d584;
    --pink:#ff8eaa;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(circle at center, #231535 0%, #100818 100%);
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
    padding:24px;
    color: #f3ece0;
  }

  .bg-blob{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    z-index:0;
    opacity:.4;
    animation: blobFloat 12s ease-in-out infinite alternate;
  }
  .blob-1{width:420px;height:420px;background:#4a2858;bottom:-80px;left:-90px;}
  .blob-2{width:480px;height:480px;background:#683b58;top:-100px;right:-100px;animation-delay: -6s;}
  @keyframes blobFloat {
    0%{ transform: translate(0, 0) scale(1); }
    100%{ transform: translate(30px, -40px) scale(1.1); }
  }

  .stars {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: 
      radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 40px 70px, #ffd166, rgba(0,0,0,0)),
      radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 160px 120px, #ff8eaa, rgba(0,0,0,0)),
      radial-gradient(1px 1px at 220px 180px, #ffffff, rgba(0,0,0,0));
    background-repeat: repeat;
    background-size: 250px 250px;
    opacity: 0.35;
  }

  #fireworksCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  .main-container{
    position:relative;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
    max-width:640px;
  }

  .radio-scene{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:420px;
  }
  .radio-eyebrow{
    font-size:.78rem;
    letter-spacing:.25em;
    text-transform:uppercase;
    color:var(--gold-soft);
    margin-bottom:14px;
    opacity:.95;
    text-shadow: 0 2px 10px rgba(212,175,55,0.3);
  }

  .radio-body{
    position:relative;
    width:330px;
    background:linear-gradient(160deg,#422955,#271633);
    border-radius:28px;
    padding:28px 24px 22px;
    box-shadow:0 25px 50px rgba(10,5,15,0.6), inset 0 1px 0 rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .radio-body::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid rgba(255,255,255,.05);
    border-radius:22px;
    pointer-events:none;
  }

  .radio-top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:16px;
  }
  .radio-feet{
    display:flex;
    gap:6px;
  }
  .radio-antenna{
    position:absolute;
    top:-50px;
    right:42px;
    width:2px;
    height:54px;
    background:var(--gold-soft);
    transform:rotate(18deg);
    transform-origin:bottom;
  }
  .radio-antenna::after{
    content:"";
    position:absolute;
    top:-4px;left:50%;
    transform:translateX(-50%);
    width:8px;height:8px;
    border-radius:50%;
    background:var(--gold-soft);
    box-shadow: 0 0 8px var(--gold-soft);
  }

  .radio-grille{
    height:78px;
    border-radius:14px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.45) 0 2px, transparent 2px 8px),
      linear-gradient(160deg,#22132e,#170b20);
    box-shadow:inset 0 4px 10px rgba(0,0,0,0.6);
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
    border: 1px solid rgba(255,255,255,0.03);
  }
  .eq-bars{
    position:absolute;
    inset:0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:5px;
    padding-bottom:14px;
  }
  .eq-bars span{
    width:4px;
    height:8px;
    border-radius:2px;
    background:var(--gold-soft);
    opacity:.85;
    animation:eqBounce 1.1s ease-in-out infinite;
    animation-play-state:paused;
    box-shadow: 0 0 6px rgba(243,213,132,0.4);
  }
  .eq-bars span:nth-child(1){ animation-delay:.0s; }
  .eq-bars span:nth-child(2){ animation-delay:.15s; }
  .eq-bars span:nth-child(3){ animation-delay:.3s; }
  .eq-bars span:nth-child(4){ animation-delay:.45s; }
  .eq-bars span:nth-child(5){ animation-delay:.2s; }
  .eq-bars span:nth-child(6){ animation-delay:.05s; }
  .eq-bars span:nth-child(7){ animation-delay:.35s; }
  .radio-body.playing .eq-bars span{ animation-play-state:running; }
  @keyframes eqBounce{
    0%,100%{ height:8px; }
    50%{ height:36px; }
  }

  .track-info{
    text-align:center;
    color:#f3ece0;
    margin-bottom:14px;
  }
  .track-title{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:1.2rem;
    margin-bottom:2px;
    color: #fff;
  }
  .track-sub{
    font-size:.75rem;
    letter-spacing:.05em;
    color:#d0b5e8;
  }

  .radio-seek{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .radio-seek span{
    font-size:.68rem;
    color:#d0b5e8;
    width:32px;
    text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .radio-seek input[type="range"]{
    flex:1;
    -webkit-appearance:none;
    appearance:none;
    height:4px;
    border-radius:2px;
    background:rgba(255,255,255,.18);
    outline:none;
  }
  .radio-seek input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px;height:13px;
    border-radius:50%;
    background:var(--gold-soft);
    box-shadow: 0 0 8px var(--gold-soft);
    cursor:pointer;
    margin-top:-4.5px;
  }

  .radio-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    margin-bottom:18px;
  }
  .radio-controls button{
    background:none;
    border:none;
    cursor:pointer;
    color:#f3ece0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .15s ease, opacity .15s ease;
  }
  .radio-controls button:hover{ transform:scale(1.08); opacity:.85; }
  .btn-skip svg{ width:18px;height:18px; }
  .btn-play{
    width:56px;height:56px;
    border-radius:50%;
    background:linear-gradient(160deg,#f3d584,var(--gold));
    color:#1c0f28;
    box-shadow:0 8px 20px rgba(212,175,55,0.4), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .btn-play svg{ width:22px;height:22px; }

  .radio-volume{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .radio-volume svg{ width:16px;height:16px; color:#d0b5e8; flex-shrink:0; }
  .radio-volume input[type="range"]{
    flex:1;
    -webkit-appearance:none;
    appearance:none;
    height:3px;
    border-radius:2px;
    background:rgba(255,255,255,.18);
    outline:none;
  }
  .radio-volume input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:10px;height:10px;
    border-radius:50%;
    background:#d0b5e8;
    cursor:pointer;
    margin-top:-3.5px;
  }

  .radio-note{
    margin-top:16px;
    font-size:.76rem;
    color:#d0b5e8;
    text-align:center;
    max-width:300px;
    line-height:1.4;
    opacity: 0.8;
  }

  /* Animasi Smooth untuk Tombol Next (Muncul setelah 6 detik) */
  .next-page-container {
    margin-top: 14px;
    opacity: 0;
    transform: translateY(12px) scale(0.95);
    transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
  }
  .next-page-container.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .btn-spinning-next {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 11px 22px;
    background: linear-gradient(135deg, #ffd166, #ff8eaa);
    color: #1a0b26;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 0.83rem;
    letter-spacing: 0.05em;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 142, 170, 0.35);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    text-decoration: none;
    overflow: hidden;
    animation: floatBtn 3s ease-in-out infinite;
  }
  
  @keyframes floatBtn {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  .btn-spinning-next::before {
    content: '';
    position: absolute;
    inset: -2px;
    background: linear-gradient(45deg, #fff, var(--gold), #ff8eaa, #fff);
    border-radius: 32px;
    z-index: -1;
    opacity: 0.7;
    animation: borderSpin 3s linear infinite;
  }
  @keyframes borderSpin {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  .btn-spinning-next:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 25px rgba(255, 142, 170, 0.55);
  }

  @media (max-width:380px){
    .radio-body{ width:280px; padding:22px 18px 16px; }
    .radio-antenna{ right:30px; }
  }
</style>
</head>
<body>

<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>
<div class="stars"></div>
<canvas id="fireworksCanvas"></canvas>

<div class="main-container">
  <div class="radio-scene">
    <p class="radio-eyebrow">Melodi Spesial Untukmu</p>

    <div class="radio-body" id="radioBody">
      <div class="radio-antenna"></div>
      <div class="radio-top-row">
        <div class="radio-feet">
          <div style="width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);"></div>
          <div style="width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);"></div>
        </div>
      </div>

      <div class="radio-grille">
        <div class="eq-bars">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="track-info">
        <div class="track-title" id="trackTitle">Cahaya Cintaku</div>
        <div class="track-sub" id="trackSub">Special Birthday Song</div>
      </div>

      <div class="radio-seek">
        <span id="curTime">0:00</span>
        <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1">
        <span id="durTime">0:00</span>
      </div>

      <div class="radio-controls">
        <button class="btn-skip" id="btnBack" aria-label="Mundur 10 detik">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6V2L4 8l7 6v-4c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H3c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        </button>
        <button class="btn-play" id="btnPlay" aria-label="Putar lagu">
          <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button class="btn-skip" id="btnFwd" aria-label="Maju 10 detik">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6V2l7 6-7 6v-4c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69-6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
        </button>
      </div>

      <div class="radio-volume">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="0.8">
      </div>
    </div>

    <!-- Tombol menuju halaman berikutnya (muncul smooth setelah 6 detik) -->
    <div class="next-page-container" id="nextPageContainer">
      <a href="screen3.html" class="btn-spinning-next">
        Lanjutkan Perjalanan ✨
      </a>
    </div>

    <p class="radio-note">Tekan tombol Play untuk mulai mendengarkan lagu 🎶</p>
    <audio id="audio" src="cahaya.wav" preload="metadata"></audio>
  </div>
</div>

<script>
  const audio = document.getElementById('audio');
  const radioBody = document.getElementById('radioBody');
  const btnPlay = document.getElementById('btnPlay');
  const iconPlay = document.getElementById('iconPlay');
  const iconPause = document.getElementById('iconPause');
  const btnBack = document.getElementById('btnBack');
  const btnFwd = document.getElementById('btnFwd');
  const seekBar = document.getElementById('seekBar');
  const volumeBar = document.getElementById('volumeBar');
  const curTime = document.getElementById('curTime');
  const durTime = document.getElementById('durTime');
  const nextPageContainer = document.getElementById('nextPageContainer');

  audio.volume = 0.8;
  let fireworksStarted = false;
  let timerTrigger = null;

  function formatTime(sec){
    if (!isFinite(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }

  function togglePlay(){
    if (audio.paused){
      audio.play().catch(() => {
        alert('File audio "cahaya.wav" tidak ditemukan atau gagal diputar. Pastikan file berada di folder yang sama.');
      });
    } else {
      audio.pause();
    }
  }

  btnPlay.addEventListener('click', togglePlay);
  btnBack.addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
  btnFwd.addEventListener('click', () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); });

  audio.addEventListener('play', () => {
    iconPlay.style.display = 'none';
    iconPause.style.display = 'block';
    radioBody.classList.add('playing');

    // 1. Kembang api langsung menyala saat play ditekan pertama kali
    if (!fireworksStarted) {
      fireworksStarted = true;
      startFireworks();

      // 2. Button next baru muncul smooth setelah 6 detik
      timerTrigger = setTimeout(() => {
        nextPageContainer.classList.add('show');
      }, 6000);
    }
  });

  audio.addEventListener('pause', () => {
    iconPlay.style.display = 'block';
    iconPause.style.display = 'none';
    radioBody.classList.remove('playing');
  });

  audio.addEventListener('loadedmetadata', () => {
    seekBar.max = audio.duration || 0;
    durTime.textContent = formatTime(audio.duration);
  });
  audio.addEventListener('timeupdate', () => {
    seekBar.value = audio.currentTime;
    curTime.textContent = formatTime(audio.currentTime);
  });
  audio.addEventListener('ended', () => {
    radioBody.classList.remove('playing');
  });

  seekBar.addEventListener('input', () => { audio.currentTime = seekBar.value; });
  volumeBar.addEventListener('input', () => { audio.volume = volumeBar.value; });


  /* --- KEMBANG API (Fireworks Canvas Script) --- */
  const canvas = document.getElementById('fireworksCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.alpha = 1;
      this.decay = Math.random() * 0.015 + 0.01;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += 0.08;
      this.alpha -= this.decay;
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  let particles = [];
  const colors = ['#ffd166', '#ff8eaa', '#ffffff', '#c39b6b', '#d0b5e8', '#ffccd5'];

  function createFirework() {
    const x = Math.random() * (canvas.width - 200) + 100;
    const y = Math.random() * (canvas.height / 2);
    const particleCount = 50;
    const chosenColor = colors[Math.floor(Math.random() * colors.length)];
    
    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle(x, y, chosenColor));
    }
  }

  let fireworkInterval = null;
  function startFireworks() {
    createFirework();
    fireworkInterval = setInterval(() => {
      createFirework();
    }, 1200);
  }

  function animateFireworks() {
    requestAnimationFrame(animateFireworks);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach((p, index) => {
      p.update();
      p.draw();
      if (p.alpha <= 0) {
        particles.splice(index, 1);
      }
    });
  }
  animateFireworks();
</script>
</body>
</html>
